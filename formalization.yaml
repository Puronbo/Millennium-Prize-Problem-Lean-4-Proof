proofs:
  - module: UniversalSingularity/BSD37a1.lean
    status: complete
    sorries: 0
    description: >-
      Fully proved concrete arithmetic on the rational elliptic curve 37a1
      (y^2 + y = x^3 - x): discriminant Delta = 37, twelve nonsingular rational
      points, pairwise distinct (identity included: thirteen group elements,
      kernel-checked by norm_num), the group-law relations nP for n = 2..9
      (with 2T = X and the independent check 3T = 9P; plus direct pair checks
      Q + R = P, Q + T = W, S + P = U, U + T = P), the inverse pairs
      P + R = 0, Q + U = 0, T + S = 0 plus -2P = U, -3P = S, -S = T, the
      integer multiples (n : Int) • p identified for -3 <= n <= 9, and the
      no-torsion forms (n : Nat) • p ≠ 0 and (n : Int) • p ≠ 0, i.e. no torsion
      of order 2 through 9. Does not prove BSD.
