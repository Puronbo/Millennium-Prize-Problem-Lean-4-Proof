proofs:
  - module: UniversalSingularity/BSD37a1.lean
    status: complete
    sorries: 0
    description: >-
      Fully proved concrete arithmetic on the rational elliptic curve 37a1
      (y^2 + y = x^3 - x): discriminant Delta = 37, the twenty-seven
      nonsingular rational points P, 2P..27P, -P, -2P, -3P, -4P..-9P, all
      integer multiples (m : Int) • p of the generator P for -9 <= m <= 27, the
      pairwise-distinct symmetric family {0, +-P, ..., +-9P} of nineteen
      elements and {0, 10P, ..., 18P} of ten elements (kernel-checked by
      norm_num), the group-law relations nP for n = 2..9 (with 2T = X and the
      independent check 3T = 9P; plus direct pair checks Q + R = P, Q + T = W,
      S + P = U, U + T = P), the inverse pairs P + R = 0, Q + U = 0, T + S = 0
      plus -2P = U, -3P = S, -S = T, the no-torsion forms (n : Nat) • p ≠ 0 and
      (n : Int) • p ≠ 0 for 2 <= |n| <= 27 giving each named multiple 2P
      through 9P its own small-order no-torsion certificate, and the quantified
      certificates not_nsmul_p_torsion_le_27, nsmul_p_injective_le_27 and
      nsmul_p_ne_zsmul_neg: P has no torsion of any order 2 <= n <= 27, and the
      twenty-eight group elements 0, +-P..+-9P and 10P..18P are pairwise
      distinct. Does not prove BSD.
  - module: UniversalSingularity/HilbertPolya.lean
    status: partial
    sorries: 3
    description: >-
      Hilbert-Polya spectral bridge. The three classical bridge claims
      (Riemann-von Mangoldt counting, existence of the self-adjoint operator,
      Montgomery-Odlyzko GUE pair-correlation) are pinned as explicit sorry
      gaps. Fully proved (0 sorries): the 'imaginary frequency axis'
      bookkeeping — imaginaryAxis_eq_range_mul_I (the imaginary axis is I*R),
      mul_I_re / mul_I_im (pure frequencies carry zero real part and their
      frequency equals the height), ext_mul_I_iff (injectivity of the
      frequency embedding), zero_height_from_trivial_zero (the trivial zero -2
      realizes the zero height in zeroImagParts), and the consistency check
      hp_forces_height_zero (a real spectrum under the pure-frequency encoding
      contains only the zero height — a genuine HP operator stores heights as
      real eigenvalues gamma, not points I*gamma). Plus
      trivialZero_mem_genuineZerosZ / genuineZerosZ_nonempty: every trivial
      zero of zeta inhabits the HP genuine-zero set.
  - module: UniversalSingularity/RiemannHypothesisZeta.lean
    status: complete
    sorries: 0
    description: >-
      Verified concrete zeta layer for the Riemann Hypothesis. Proves
      zeta(0) = -1/2 (so 0 is not a zero), nonvanishing at s = 1 and on the
      closed half-plane Re s >= 1 (hence every zero z of zeta has Re z < 1),
      the trivial-zero family -2(n+1) for n : Nat genuinely in
      riemannZetaZeros and strictly left of the critical strip, the zero set
      closed and discrete with finite intersection with every compact set, the
      Dirichlet series identity zeta(s) = sum' n, 1/n^s for Re s > 1, the
      functional equation, complex-analyticity away from the pole s = 1, and
      the logic-level restatement riemannHypothesis_iff_zeros of mathlib's own
      RiemannHypothesis predicate. Also verifies the trivial family is
      real-axis (Im = 0) and strictly left of the critical strip (Re <= -2):
      trivialZero_im_zero, trivialZero_re_nonpos. Does not prove RH.
  - module: UniversalSingularity/PoincareSphere.lean
    status: complete
    sorries: 0
    description: >-
      Verified concrete layer for the Poincare Conjecture: the unit 3-sphere S3
      in R^4 is inhabited, path-connected, compact, and a smooth C^infty
      3-manifold charted by R^3. Mathlib has no SimplyConnectedSpace S3
      instance; that simply-connectedness statement is exactly the Poincare
      gap.
  - module: UniversalSingularity/YangMillsMilestone.lean
    status: complete
    sorries: 0
    description: >-
      Verified concrete base layer for Yang-Mills: the base manifold S4 in R^5
      is inhabited, path-connected, compact, and a smooth C^infty 4-manifold
      charted by R^4. No gauge-theoretic content is claimed.
  - module: UniversalSingularity/PvsNPPolytime.lean
    status: complete
    sorries: 0
    description: >-
      Verified concrete layer for P vs NP: the polynomial step-bound predicate
      PolytimeBound used by the P/NP bridges is closed under pointwise sum,
      pointwise product, constants, and monotone domination. Does not settle
      P vs NP.
  - module: UniversalSingularity/BridgeIntegrity.lean
    status: complete
    sorries: 0
    description: >-
      Verified placeholder-integrity layer: the Navier-Stokes skeleton
      (globalSmoothSolutionExists _ = false) visibly fails the pinned
      NavierStokesGlobalRegularity statement, and the Yang-Mills skeleton
      (massGap _ = 0) visibly fails the pinned YangMillsMassGapProblem of
      positive mass gap, so those sorry gaps are non-vacuous. The Hodge
      skeleton is deliberately not asserted anywhere because its stubs would
      make HodgeConjecturePinned X reduce to (forall p, 0 = 0), vacuously true,
      which would be misleading.
